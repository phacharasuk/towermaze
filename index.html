<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower Maze</title>
<style>
/* Layout: one-column phone board. Status line, wave chips, 8x11 field, a fixed-height tray, then the main button. */
:root{
  --bg:#eceee7; --panel:#f8f9f5; --ink:#1e2622; --muted:#5d6961; --line:#cdd4c6;
  --field:#e0e6d8; --grid:#cad2c0; --rock:#878c81; --path:#8d9b82;
  --tower:#2c5a4e; --on-accent:#ffffff; --cannon:#7b4b26; --wall:#58635c; --base:#f3f5ef;
  --enemy:#c4521c; --armor:#46505e; --armor-edge:#9aa4b2; --hp:#2e7d4f; --danger:#b42318; --gold:#8a5f05; --star:#b98200;
  --entry:#2e7d4f; --exit:#b42318; --ok:#2e7d4f; --scrim:rgba(30,38,34,.38);
  --frost:#2b78b5; --aa:#6b4fa0; --fast:#a87a00; --fly:#b83280; --boss:#3f1d6b; --shield:#2f6f8f;
  --font:"Leelawadee UI","Thonburi","Noto Sans Thai","Sukhumvit Set",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131714; --panel:#1c221e; --ink:#e4eae2; --muted:#9aa79e; --line:#323b34;
  --field:#1b211c; --grid:#2b342d; --rock:#4b5149; --path:#6d7d68;
  --tower:#7fb8a4; --on-accent:#0f1a16; --cannon:#c99a6b; --wall:#8a958d; --base:#262e28;
  --enemy:#f08a5d; --armor:#a3acb9; --armor-edge:#5b6573; --hp:#6fcf97; --danger:#f97066; --gold:#e0b44c; --star:#e9b949;
  --entry:#6fcf97; --exit:#f97066; --ok:#6fcf97; --scrim:rgba(0,0,0,.55);
  --frost:#7cc4f0; --aa:#b49ae0; --fast:#e9c46a; --fly:#f07ab8; --boss:#c4a5ff; --shield:#7fc6e4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --panel:#1c221e; --ink:#e4eae2; --muted:#9aa79e; --line:#323b34;
  --field:#1b211c; --grid:#2b342d; --rock:#4b5149; --path:#6d7d68;
  --tower:#7fb8a4; --on-accent:#0f1a16; --cannon:#c99a6b; --wall:#8a958d; --base:#262e28;
  --enemy:#f08a5d; --armor:#a3acb9; --armor-edge:#5b6573; --hp:#6fcf97; --danger:#f97066; --gold:#e0b44c; --star:#e9b949;
  --entry:#6fcf97; --exit:#f97066; --ok:#6fcf97; --scrim:rgba(0,0,0,.55);
  --frost:#7cc4f0; --aa:#b49ae0; --fast:#e9c46a; --fly:#f07ab8; --boss:#c4a5ff; --shield:#7fc6e4; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--tower);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:8px 8px;box-sizing:border-box}
.screen{display:flex;flex-direction:column;gap:8px}

/* home */
.home{gap:14px}
.homebar{display:flex;justify-content:flex-end;min-height:40px;align-items:center}
.home h1{margin:9vh 0 18px;font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1}
.home h1 span{display:block;font-size:13px;font-weight:600;letter-spacing:3px;color:var(--muted);margin-top:8px;text-transform:uppercase}
:lang(th) .home h1 span{letter-spacing:0;font-size:14px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{min-height:34px;min-width:44px;padding:0 12px;border:0;background:none;font-weight:700;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--tower);color:var(--on-accent)}
.big{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:17px;font-weight:700;text-align:left;padding-inline:18px}
.big.primary{background:var(--tower);border-color:var(--tower);color:var(--on-accent)}
.big small{display:block;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.big.primary small{color:var(--on-accent);opacity:.8}
.ver{margin:10px 0 0;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.top .tr{display:flex;gap:16px}
.top .sp{width:64px}
.link{background:none;border:0;color:var(--tower);padding:8px 0;font-weight:600}
.top h2{margin:0;font-size:16px;font-weight:700}

/* stage select */
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv{aspect-ratio:1;max-width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv b{font-size:22px;font-variant-numeric:tabular-nums}
.lv small{color:var(--star);letter-spacing:1px;font-size:13px}
.lv .rec{color:var(--muted);letter-spacing:0;font-size:11.5px;font-variant-numeric:tabular-nums}
.lv:disabled{opacity:.4;cursor:default}
.lv .tag{color:var(--aa);letter-spacing:0;font-size:10.5px;font-weight:700}
.tool .tn{display:inline-flex;align-items:center;gap:3px}
.tool .nm{font-size:13px;white-space:nowrap}
.tool .ti{width:18px;height:18px;display:block}

/* settings */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px}
.setrow span{font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:7px;background:none;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--tower);color:var(--on-accent)}
.seg.mini{min-width:132px;background:var(--bg)}
.big.danger{color:var(--danger);border-color:var(--danger);background:none}
.confirm{background:var(--panel);border:1.5px solid var(--danger);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;line-height:1.45}
.confirm .row{display:flex;gap:8px}
.confirm .row button{flex:1;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700}
.confirm .row button.dgo{background:var(--danger);border-color:var(--danger);color:#fff}
.done{margin:0;color:var(--muted);font-weight:600}
.backup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.backup > span{font-weight:600}
.backup .row{display:flex;gap:8px}
.backup .row button,.bkapply{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700}
.bkapply,.backup .row button.bkapply{background:var(--tower);border-color:var(--tower);color:var(--on-accent)}
.backup textarea{width:100%;box-sizing:border-box;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;-webkit-user-select:text;user-select:text;word-break:break-all}

/* guide */
.book{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.book .note{margin:0;color:var(--muted);font-size:13px}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.entry .head{display:flex;gap:12px;align-items:center}
.entry .head div{min-width:0}
.entry canvas{width:48px;height:48px;flex:none;border-radius:8px;background:var(--field)}
.entry h3{margin:0;font-size:16px}
.entry p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.4}
.entry .hits{color:var(--ink);font-weight:600}
.entry.locked h3,.entry.locked p{color:var(--muted)}
.stat{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.stat th,.stat td{padding:4px 6px;text-align:right;border-top:1px solid var(--line)}
.stat th:first-child,.stat td:first-child{text-align:left;color:var(--muted);font-weight:400}
.stat thead th{border-top:0;color:var(--muted);font-weight:600}

/* play */
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.stats .g b{color:var(--gold)}
.stats{align-items:center}
.ico{display:inline-flex;align-items:center;gap:4px}
.ico svg{width:16px;height:16px;display:block}
.ico .heart{fill:var(--danger)}
.ico .coin{fill:var(--gold)}
.ico .coin-in{fill:none;stroke:var(--panel);stroke-width:1.2;opacity:.7}
.wbtn{order:9;margin-left:auto;min-height:30px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.wbtn[aria-expanded="true"]{border-color:var(--tower);color:var(--tower)}
.wpanel{position:absolute;left:6px;right:6px;top:6px;z-index:2;padding:8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.waves{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;padding:1px 7px;line-height:1.35;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);margin-right:3px}
.chip .en{display:inline-flex;align-items:center;gap:1px}
.chip .ei{width:16px;height:16px;display:block}
.chip.now{border-color:var(--tower);background:var(--panel);color:var(--ink)}
.chip.done{opacity:.45}
.board{position:relative;align-self:center}
canvas{display:block}
#cv{border-radius:6px;touch-action:none;-webkit-touch-callout:none}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:7px 12px;border-radius:8px;white-space:nowrap;pointer-events:none}
.tray{min-height:52px;display:flex}
.tools{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.tool{font-size:14px;min-height:52px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:0}
.tool .cost{font-size:12.5px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
.tool[aria-pressed="true"]{border-color:var(--tower);box-shadow:inset 0 0 0 1.5px var(--tower)}
.tool:disabled{opacity:.42}
.tpanel{flex:1;display:flex;align-items:center;gap:8px;border:1.5px solid var(--tower);border-radius:10px;padding:0 6px 0 12px;background:var(--panel)}
.tpanel .tname{flex:1;font-weight:700;min-width:0}
.sbtn{min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sbtn:disabled{opacity:.42;cursor:default}
.xbtn{min-height:40px;min-width:40px;border:0;background:none;color:var(--muted);font-size:18px}
.actions{display:flex;gap:8px}
.main{flex:1;min-height:52px;border:0;border-radius:12px;background:var(--tower);color:var(--on-accent);font-size:17px;font-weight:700}
.main:disabled{opacity:.5;cursor:default}
.speed{width:68px;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums}
.speed[aria-pressed="true"]{border-color:var(--tower);color:var(--tower);box-shadow:inset 0 0 0 1.5px var(--tower)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);border-radius:6px}
.card{background:var(--panel);border-radius:14px;padding:18px;width:min(88%,290px);box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:24px}
.card .stars{font-size:30px;letter-spacing:6px;color:var(--star);line-height:1}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;margin-top:6px}
.card .row button{flex:1;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700}
.card .row button.go{background:var(--tower);border-color:var(--tower);color:var(--on-accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <section id="scrHome" class="screen home">
    <div class="homebar"><div class="lang" role="group" aria-label="Language"><button id="langTH">TH</button><button id="langEN">EN</button></div></div>
    <h1>Tower Maze<span data-t="tagline"></span></h1>
    <button id="goStage" class="big primary">Stage</button>
    <button id="goEndless" class="big">Endless</button>
    <button id="goSettings" class="big">Settings</button>
    <button id="goGuide" class="big">Guide</button>
    <p id="appVer" class="ver"></p>
  </section>

  <section id="scrLevels" class="screen" hidden>
    <div class="top"><button class="link" data-home data-t="home"></button><h2>Stage</h2><span class="sp"></span></div>
    <div id="lvGrid" class="lvgrid"></div>
  </section>

  <section id="scrEndless" class="screen" hidden>
    <div class="top"><button class="link" data-home data-t="home"></button><h2>Endless</h2><span class="sp"></span></div>
    <button id="goClassic" class="big primary">Classic</button>
    <button id="goRandom" class="big">Random</button>
    <div id="resumeBox" class="backup" hidden>
      <span id="resumeTitle"></span>
      <div class="row"><button id="resumeGo" class="bkapply"></button><button id="resumeNew" data-t="newRun"></button></div>
    </div>
  </section>

  <section id="scrSettings" class="screen" hidden>
    <div class="top"><button class="link" data-home data-t="home"></button><h2>Settings</h2><span class="sp"></span></div>
    <div class="setrow"><span data-t="setSpeed"></span><div class="seg mini"><button id="spd1">×1</button><button id="spd2">×2</button></div></div>
    <div class="setrow"><span data-t="setSound"></span><div class="seg mini"><button id="sndOn" data-t="on"></button><button id="sndOff" data-t="off"></button></div></div>
    <button id="btnReset" class="big danger" data-t="reset"></button>
    <div id="resetBox" class="confirm" hidden>
      <p data-t="resetAsk"></p>
      <div class="row"><button id="resetNo" data-t="cancel"></button><button id="resetYes" class="dgo" data-t="erase"></button></div>
    </div>
    <p id="resetDone" class="done" data-t="erased" hidden></p>
    <div class="backup">
      <span data-t="backup"></span>
      <div class="row"><button id="bkCopy" data-t="bkCopy"></button><button id="bkRestore" data-t="bkRestore"></button></div>
      <textarea id="bkText" rows="3" spellcheck="false" autocomplete="off" hidden></textarea>
      <button id="bkApply" class="bkapply" data-t="bkApply" hidden></button>
      <p id="bkMsg" class="done" hidden></p>
    </div>
  </section>

  <section id="scrBook" class="screen" hidden>
    <div class="top"><button id="bookBack" class="link"></button><h2>Guide</h2><span class="sp"></span></div>
    <div class="seg"><button id="tabT" data-t="tabT"></button><button id="tabE" data-t="tabE"></button></div>
    <div id="bookList" class="book"></div>
  </section>

  <section id="scrPlay" class="screen" hidden>
    <div class="top"><button class="link" data-home data-t="home"></button><h2 id="lvTitle"></h2><div class="tr"><button id="btnInfo" class="link">Guide</button><button id="btnRestart" class="link" data-t="restart"></button></div></div>
    <div class="stats">
      <span class="ico" id="icoLives"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="heart" d="M8 14.2 2.4 8.8A3.4 3.4 0 0 1 8 4.4a3.4 3.4 0 0 1 5.6 4.4z"/></svg><b id="sLives">5</b></span>
      <span class="ico g" id="icoGold"><svg viewBox="0 0 16 16" aria-hidden="true"><circle class="coin" cx="8" cy="8" r="6.2"/><circle class="coin-in" cx="8" cy="8" r="3.6"/></svg><b id="sGold">0</b></span>
      <span id="sLevelBox"><span data-t="spent"></span> <b id="sSpent">0</b> · <span data-t="par"></span> <b id="sPar">0</b> · <span data-t="best"></span> <b id="sRec">–</b></span>
      <button id="btnWaves" class="wbtn" aria-expanded="false"></button>
      <span id="sEndBox" hidden><span data-t="interest"></span> <b id="sInt">+0</b> · <span data-t="best"></span> <b id="sBest">0</b> <span data-t="waves"></span></span>
    </div>
    <div id="board" class="board">
      <canvas id="cv"></canvas>
      <div id="waves" class="waves wpanel" hidden></div>
      <div id="toast" class="toast" hidden></div>
      <div id="overlay" class="overlay" hidden>
        <div class="card">
          <h3 id="rTitle"></h3>
          <div id="rStars" class="stars"></div>
          <p id="rText"></p>
          <div class="row"><button id="rA"></button><button id="rB" class="go"></button></div>
        </div>
      </div>
    </div>
    <div class="tray">
      <div id="tools" class="tools"></div>
      <div id="tpanel" class="tpanel" hidden>
        <span id="tName" class="tname"></span>
        <button id="btnUp" class="sbtn"></button>
        <button id="btnSell" class="sbtn"></button>
        <button id="btnClose" class="xbtn">✕</button>
      </div>
    </div>
    <div class="actions">
      <button id="btnMain" class="main"></button>
      <button id="btnSpeed" class="speed" aria-pressed="false">×2</button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* ================= pure simulation (no DOM) ================= */
const COLS = 8, ROWS = 11, N = COLS * ROWS, TICK = 1 / 30, SPAWN_D = -0.6, GROUP_GAP = 1.5;

const TOWERS = {
  wall:   { name: 'กำแพง', cost: [2] },
  gun:    { name: 'ปืน', cost: [20, 15, 25], range: [2.6, 2.7, 2.9], dmg: [6, 10, 14], cd: [0.4, 0.4, 0.35], hits: 'ground' },
  // maxHit = most enemies one blast can hit (closest to the blast first)
  cannon: { name: 'ปืนใหญ่', cost: [40, 30, 45], range: [2.8, 2.9, 3.1], dmg: [16, 26, 38], cd: [1.5, 1.5, 1.4], splash: [0.9, 1.0, 1.1], maxHit: [3, 3, 4], hits: 'ground' },
  frost:  { name: 'น้ำแข็ง', cost: [15, 15, 20], range: [2.5, 2.7, 2.9], dmg: [0, 0, 0], cd: [0.8, 0.8, 0.8], slow: [0.4, 0.5, 0.6], slowDur: 1.2, hits: 'both' },
  aa:     { name: 'ยิงอากาศ', cost: [25, 20, 30], range: [3.0, 3.2, 3.5], dmg: [14, 22, 32], cd: [0.5, 0.5, 0.45], hits: 'air' },
};
const ENEMIES = {
  normal: { name: 'ธรรมดา', hp: 24, speed: 1.2, armor: 0, bounty: 1 },
  armor:  { name: 'เกราะ', hp: 60, speed: 0.8, armor: 3, bounty: 3 },
  fast:   { name: 'วิ่งเร็ว', hp: 16, speed: 2.2, armor: 0, bounty: 1 },
  fly:    { name: 'บิน', hp: 45, speed: 1.2, armor: 0, bounty: 2, fly: true },
  // boss: costs `lives` lives when it gets through · slowRes = share of a Frost slow that works on it
  boss:   { name: 'บอส', hp: 600, speed: 0.5, armor: 2, bounty: 15, lives: 3, slowRes: 0.5 },
  // blastRes: a Cannon blast does only 1 damage to it (Gun / Frost / Anti-Air work normally)
  shield: { name: 'โล่', hp: 40, speed: 1.0, armor: 0, bounty: 2, blastRes: true },
};

// map: S = entry, E = exit, # = rock · theme: 1 gun+wall · 2 cannon · 3 frost · 4 anti-air (par = best plan the solver found)
const w = (t, n, gap, hp) => (hp ? { t, n, gap, hp } : { t, n, gap });
const O = '........';
const LEVELS_RAW = [
  /* 1  T1 */ { map: ['...S....', O, O, O, O, O, O, O, O, O, '....E...'], gold: 60, bonus: 10, lives: 5, par: 80, tools: ['wall', 'gun'],
    waves: [[w('normal', 8, 0.9)], [w('normal', 16, 0.5)], [w('normal', 30, 0.35)]] },
  /* 2  T1 */ { map: ['S.......', O, O, O, O, O, O, O, O, O, '.......E'], gold: 60, bonus: 10, lives: 5, par: 60, tools: ['wall', 'gun'],
    waves: [[w('normal', 6, 1)], [w('normal', 12, 0.6)], [w('normal', 20, 0.45)]] },

    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

        e.slowEnd = Math.max(e.slowEnd, until);
      }
      if (g.vis) { F.fx.push({ k: 'pulse', from: i, x: tx, y: ty, r: R, life: 0.35, max: 0.35 }); g.ev.push('frost'); }
    } else if (def.splash) {
      const S = def.splash[t.lvl], S2 = S * S, near = [];
      for (const e of F.enemies) {
        if (e.hp <= 0 || !canHit(def, e)) continue;
        const dx = e.x - best.x, dy = e.y - best.y, q = dx * dx + dy * dy;
        if (q <= S2) near.push([q, e]);
      }
      near.sort((a, b) => a[0] - b[0]); // stable sort keeps ties in spawn order, so results stay repeatable
      for (let k = 0; k < Math.min(near.length, def.maxHit[t.lvl]); k++) { const e = near[k][1]; hit(e, ENEMIES[e.type].blastRes ? 0 : dmg); }
      if (g.vis) { F.fx.push({ k: 'boom', from: i, x: best.x, y: best.y, r: S, life: 0.3, max: 0.3 }); g.ev.push('boom'); }
    } else {
      hit(best, dmg);
      if (g.vis) { F.fx.push({ k: 'shot', from: i, x: best.x, y: best.y, life: 0.09, max: 0.09 }); g.ev.push(t.type === 'aa' ? 'aa' : 'gun'); }
    }
    if (g.vis && !def.slow) { if (!F.aim) F.aim = {}; F.aim[i] = Math.atan2(best.y - ty, best.x - tx); }
    F.cd[i] += def.cd[t.lvl];
  }

  const left = [];
  for (const e of F.enemies) {
    if (e.hp > 0) { left.push(e); continue; }
    g.gold += ENEMIES[e.type].bounty;
    if (g.vis) F.fx.push({ k: 'gold', x: e.x, y: e.y, v: ENEMIES[e.type].bounty, life: 0.8, max: 0.8 });
  }
  F.enemies = left;
  if (g.vis) { for (const f of F.fx) f.life -= TICK; F.fx = F.fx.filter(f => f.life > 0); }
  F.tick++;

  if (F.si >= F.spawns.length && F.enemies.length === 0) {
    g.lastInterest = g.lv.endless ? interestOn(g.gold) : 0;
    g.gold += g.lastInterest + g.lv.bonus + (g.lv.endless ? Math.floor(g.wave / 2) : 0); g.wave++;
    g.lastAim = F.aim; g.fight = null;
    g.phase = g.wave >= g.lv.waves.length ? 'won' : 'plan';

}

function starsOf(g) {
  if (g.phase !== 'won') return 0;
  if (g.leaked > 0) return 1;
  return spent(g) <= g.lv.par ? 3 : 2;
}

// plan = [ [ 'gun 3 4', 'wall 2 5', 'up 3 4', 'sell 3 4' ], ... ] one list per wave (col row)
function simulate(lv, plan) {
  const g = newGame(lv, false), errs = [];
  for (let w = 0; w < lv.waves.length; w++) {
    for (const a of (plan[w] || [])) {
      const [op, cs, rs] = a.split(/\s+/), i = (+rs) * COLS + (+cs);
      const e = op === 'up' ? tryUpgrade(g, i) : op === 'sell' ? sell(g, i) : tryPlace(g, op, i);
      if (e) errs.push(`w${w + 1} ${a}: ${e}`);
    }
    startWave(g);
    let guard = 0;
    while (g.phase === 'fight' && guard++ < 50000) step(g);
    if (g.phase === 'lost') break;
  }
  return { phase: g.phase, wave: g.wave, leaked: g.leaked, lives: g.lives, spent: spent(g), gold: g.gold, stars: starsOf(g), errs };
}

}


/* ---------- loop ---------- */
// while planning, redraw ~30 times a second so the route arrows slide (skipped for reduced motion)
let idleOn = false, idleTs = 0;
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function idle(ts) {
  if (!G || running || scr.play.hidden || G.phase !== 'plan') { idleOn = false; return; }
  if (ts - idleTs > 33) { idleTs = ts; draw(0); }
  requestAnimationFrame(idle);
}
function startIdle() { if (!idleOn && !reduceMotion) { idleOn = true; requestAnimationFrame(idle); } }
function frame(ts) {
  if (!running) return;
  if (scr.play.hidden) { lastTs = ts; requestAnimationFrame(frame); return; } // paused while the Guide is open
  const dt = Math.min(0.25, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  acc += dt * speed;
  let n = 0;
  while (acc >= TICK && G.phase === 'fight' && n < 20) { step(G); acc -= TICK; n++; }
  if (n === 20) acc = 0;
  playEvents();
  if (G.phase !== 'fight') { running = false; acc = 0; afterFight(); return; }
  draw(Math.min(1, acc / TICK));
  if (n) renderStats();
  requestAnimationFrame(frame);
}
function playEvents() { if (G.ev && G.ev.length) { for (const e of new Set(G.ev)) sfx(e); G.ev.length = 0; } }
function renderStats() {
  $('sLives').textContent = G.lives; $('sGold').textContent = G.gold;
  if (G.lv.endless) $('sInt').textContent = '+' + interestOn(G.gold);
}

function afterFight() {
  if (G.phase === 'plan') {
    sfx('wave');
    if (G.lv.endless) {
      markSeen([], G.lv.waves.slice(G.wave, G.wave + 2)); saveRun(false);
      if (G.lastInterest > 0) toast(tr('tInterest', G.lastInterest));
    }
  } else if (G.lv.endless) clearRun(G.lv.random); // run over
  refreshPreview(); renderUI(); draw(0); startIdle();
  if (G.phase === 'won' || G.phase === 'lost') { sfx(G.phase === 'won' ? 'win' : 'lose'); showResult(); }
}

function showEndlessResult() {
  const g = G, random = g.lv.random, cleared = g.wave, isNew = cleared > endlessBest(g.lv);
  if (isNew) { if (random) save.bestR = cleared; else save.best = cleared; persist(); }
  $('sBest').textContent = endlessBest(g.lv);
  $('rTitle').textContent = tr('runOver');
  $('rStars').hidden = true;
  $('rText').innerHTML = tr('clearedN', cleared) + (isNew ? ' · ' + tr('newBest') : '') + '<br>' + tr('modeBest', random ? 'Random' : 'Classic', endlessBest(g.lv));
  $('rA').textContent = tr('toHome'); $('rA').onclick = () => show('home');
  $('rB').textContent = tr('retry'); $('rB').onclick = () => startEndless(random);
  $('overlay').hidden = false;
}

function showResult() {
  if (G.lv.endless) return showEndlessResult();
  const g = G, won = g.phase === 'won', st = starsOf(g), n = g.lv.id, used = spent(g);
  const oldRec = save.rec[n], newRec = st === 3 && (oldRec === undefined || used < oldRec); // record counts 3-star wins only
  if (won) {
    save.stars[n] = Math.max(save.stars[n] || 0, st);
    if (newRec) save.rec[n] = used;
    persist();
    $('sRec').textContent = save.rec[n] === undefined ? '–' : save.rec[n];
  }
  $('rTitle').textContent = won ? tr('win') : tr('lose');
  $('rStars').hidden = !won; $('rStars').textContent = starStr(st);
  $('rText').innerHTML = won
    ? tr('resWin', g.leaked, used) + (newRec ? ' · ' + tr('newBest') : save.rec[n] === undefined ? '' : ' · ' + tr('bestX', save.rec[n])) + '<br>' + tr('rule3', g.lv.par)
    : tr('resLose', g.lv.lives, g.wave + 1);
  const next = won && n < LEVELS.length;
  $('rA').textContent = tr('retry'); $('rA').onclick = () => startLevel(n);
  $('rB').textContent = next ? tr('next') : tr('allStages');
  $('rB').onclick = () => next ? startLevel(n + 1) : show('levels');
  $('overlay').hidden = false;
}

/* ---------- input ---------- */
// Placing (every tool, walls too): press on the board and drag; the ghost is the cell under the finger,
// release drops it. A plain tap on an empty cell places too.
const MOVE_PX = 8;
const REASON = { block: 'tBlock', gold: 'tGold', occupied: 'tOcc' };
function boardXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function cellAt(x, y) {
  const c = Math.floor(x / CS), r = Math.floor(y / CS);
  return c < 0 || r < 0 || c >= COLS || r >= ROWS ? -1 : r * COLS + c;
}
function redraw() { if (!running) draw(0); }

cv.addEventListener('pointerdown', e => {
  if (!G || G.phase === 'won' || G.phase === 'lost' || drag) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = boardXY(e), down = cellAt(x, y);
  drag = { id: e.pointerId, x0: x, y0: y, t0: performance.now(), down, moved: false, mode: 'fight', ghost: -1 };
  if (down >= 0 && G.towers[down]) drag.mode = 'pending';
  else if (G.phase === 'plan' && sel >= 0) drag.mode = 'deselect'; // first tap away from a selected tower only closes it
  else if (G.phase === 'plan' && !G.locked) { drag.mode = 'place'; drag.ghost = down; renderUI(); }
  redraw();
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const [x, y] = boardXY(e);
  if (!drag.moved && Math.hypot(x - drag.x0, y - drag.y0) > MOVE_PX) drag.moved = true;
  if ((drag.mode === 'pending' || drag.mode === 'deselect') && drag.moved && G.phase === 'plan' && !G.locked) { drag.mode = 'place'; sel = -1; renderUI(); }
  if (drag.mode !== 'place') return;
  const gc = cellAt(x, y);
  if (gc !== drag.ghost) { drag.ghost = gc; redraw(); }
});
function finishDrag(ok) {
  const d = drag; drag = null;
  if (!d) return;
  if (ok && d.mode === 'pending' && !d.moved) sel = sel === d.down ? -1 : d.down;
  else if (ok && d.mode === 'deselect') sel = -1;
  else if (ok && d.mode === 'fight') { if (!d.moved && sel >= 0) sel = -1; else toast(tr(G.locked ? 'tLocked' : 'tPhase')); }
  else if (ok && d.mode === 'place' && d.ghost >= 0) { // a tap or a drag: drop on the cell under the finger
    const err = tryPlace(G, tool, d.ghost);
    if (err && REASON[err]) { toast(tr(REASON[err])); sfx('error'); }
    else if (!err) { sfx('place'); saveRun(false); }
  }
  refreshPreview(); renderUI(); redraw();
}
cv.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) finishDrag(true); });
cv.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) finishDrag(false); });

$('btnUp').addEventListener('click', () => {
  if (sel < 0 || G.locked) return;
  const e = tryUpgrade(G, sel);
  if (e === 'gold') { toast(tr('tGold')); sfx('error'); } else if (!e) { sfx('place'); saveRun(false); }
  renderUI(); draw(0);
});
$('btnSell').addEventListener('click', () => {
  if (sel < 0 || G.locked) return;
  if (!sell(G, sel)) { sel = -1; refreshPreview(); sfx('sell'); saveRun(false); }
  renderUI(); draw(0);
});
$('btnClose').addEventListener('click', () => { sel = -1; renderUI(); draw(0); });

let lastMain = 0;
$('btnMain').addEventListener('click', () => {
  const now = Date.now(); if (now - lastMain < 300) return; lastMain = now;
  if (!G || G.phase !== 'plan') return;
  audio(); // unlock sound inside the tap on iPhone
  startWave(G); G.locked = false; saveRun(true); refreshPreview(); renderUI();
  running = true; acc = 0; lastTs = performance.now();
  requestAnimationFrame(frame);
});
$('btnSpeed').addEventListener('click', () => { speed = speed === 2 ? 1 : 2; renderUI(); });
$('btnWaves').addEventListener('click', () => { wavesOpen = !wavesOpen; renderUI(); });
$('waves').addEventListener('click', () => { wavesOpen = false; renderUI(); });
$('btnRestart').addEventListener('click', () => { if (G) G.lv.endless ? startEndless(G.lv.random) : startLevel(G.lv.id); });
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => { running = false; show('home'); }));

/* ---------- home / endless menu / settings ---------- */
$('goStage').addEventListener('click', () => show('levels'));
$('goEndless').addEventListener('click', () => show('endless'));
$('goSettings').addEventListener('click', () => show('settings'));
$('goGuide').addEventListener('click', () => openBook('home'));
$('goClassic').addEventListener('click', () => pickEndless(false));
$('goRandom').addEventListener('click', () => pickEndless(true));
$('resumeGo').addEventListener('click', () => { const g = loadRun(resumeRandom); g ? startGame(g.lv, g) : startEndless(resumeRandom); });
$('resumeNew').addEventListener('click', () => startEndless(resumeRandom));
function setLang(l) { save.lang = l; persist(); applyLang(); }
$('langTH').addEventListener('click', () => setLang('th'));
$('langEN').addEventListener('click', () => setLang('en'));

function renderSettings() {
  $('spd1').setAttribute('aria-pressed', save.speed === 1 ? 'true' : 'false');
  $('spd2').setAttribute('aria-pressed', save.speed === 2 ? 'true' : 'false');
  $('sndOn').setAttribute('aria-pressed', save.sound ? 'true' : 'false');
  $('sndOff').setAttribute('aria-pressed', save.sound ? 'false' : 'true');
  $('resetBox').hidden = true; $('btnReset').hidden = false;
  $('bkText').hidden = true; $('bkApply').hidden = true; $('bkMsg').hidden = true; $('bkText').value = '';
}
function bkSay(k) { $('bkMsg').textContent = tr(k); $('bkMsg').hidden = false; }
$('bkCopy').addEventListener('click', () => {
  const code = backupCode(), box = $('bkText');
  box.value = code; box.readOnly = true; $('bkApply').hidden = true;
  const manual = () => { box.hidden = false; box.focus(); box.select(); bkSay('bkManual'); };
  try {
    navigator.clipboard.writeText(code).then(() => { box.hidden = false; bkSay('bkCopied'); }, manual);
  } catch (e) { manual(); }
});
$('bkRestore').addEventListener('click', () => {
  const box = $('bkText'); box.value = ''; box.readOnly = false; box.hidden = false; $('bkApply').hidden = false; box.focus(); bkSay('bkPaste');
});
$('bkApply').addEventListener('click', () => {
  if (!restoreCode($('bkText').value)) { bkSay('bkBad'); return; }
  applyLang(); renderSettings(); bkSay('bkDone');
});
$('spd1').addEventListener('click', () => { save.speed = 1; persist(); renderSettings(); });
$('spd2').addEventListener('click', () => { save.speed = 2; persist(); renderSettings(); });
$('sndOn').addEventListener('click', () => { save.sound = true; persist(); renderSettings(); sfx('place'); });
$('sndOff').addEventListener('click', () => { save.sound = false; persist(); renderSettings(); });
$('btnReset').addEventListener('click', () => { $('resetBox').hidden = false; $('btnReset').hidden = true; $('resetDone').hidden = true; });
$('resetNo').addEventListener('click', () => renderSettings());
$('resetYes').addEventListener('click', () => {
  save.stars = {}; save.rec = {}; save.best = 0; save.bestR = 0; save.seen = { t: {}, e: {} }; save.run = {};
  persist(); renderSettings(); $('resetDone').hidden = false;
});

/* ---------- Guide ---------- */
const num = v => (Math.round(v * 10) / 10).toString();
function statTable(head, rows) {
  const h = head ? `<thead><tr><th></th>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead>` : '';
  return `<table class="stat">${h}<tbody>${rows.map(r => `<tr><td>${r[0]}</td>${r.slice(1).map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function towerRows(k) {
  const d = TOWERS[k];
  if (k === 'wall') return { head: null, rows: [[tr('cost'), d.cost[0]]] };
  const L = [0, 1, 2], rows = [[tr('cost'), ...L.map(i => i ? '+' + d.cost[i] : d.cost[i])], [tr('range'), ...L.map(i => num(d.range[i]))]];
  if (d.slow) rows.push([tr('slow'), ...L.map(i => Math.round(d.slow[i] * 100) + '%')], [tr('slowDur'), ...L.map(() => num(d.slowDur))]);
  else {
    rows.push([tr('dmg'), ...L.map(i => d.dmg[i])], [tr('rate'), ...L.map(i => num(1 / d.cd[i]))]);
    if (d.splash) rows.push([tr('splash'), ...L.map(i => num(d.splash[i]))], [tr('maxHit'), ...L.map(i => d.maxHit[i])]);
  }
  return { head: L.map(i => tr('lvH', i + 1)), rows };
}
function buildBook() {
  $('tabT').setAttribute('aria-pressed', bookTab === 't' ? 'true' : 'false');
  $('tabE').setAttribute('aria-pressed', bookTab === 'e' ? 'true' : 'false');
  $('bookBack').textContent = bookFrom === 'play' ? tr('backGame') : tr('home');
  const list = $('bookList'); list.textContent = '';
  const keys = bookTab === 't' ? Object.keys(TOWERS) : Object.keys(ENEMIES);
  const D = TXT[save.lang];
  for (const k of keys) {
    const seen = !!save.seen[bookTab][k];
    const box = document.createElement('div'); box.className = 'entry' + (seen ? '' : ' locked');
    const head = document.createElement('div'); head.className = 'head';
    const c = document.createElement('canvas'); head.appendChild(c);
    const txt = document.createElement('div');
    if (!seen) txt.innerHTML = `<h3>???</h3><p>${tr('unknown')}</p>`;
    else if (bookTab === 't') txt.innerHTML = `<h3>${nm(k)}</h3><p>${D.descT[k]}</p>` + (TOWERS[k].hits ? `<p class="hits">${TOWERS[k].slow ? tr('affects') : tr('hitsLbl')}: ${tr(TOWERS[k].hits)}</p>` : '');
    else txt.innerHTML = `<h3>${nm(k)}</h3><p>${D.descE[k]}</p>`;
    head.appendChild(txt); box.appendChild(head);
    if (seen) {
      const tb = document.createElement('div');
      if (bookTab === 't') { const t = towerRows(k); tb.innerHTML = statTable(t.head, t.rows); }
      else { const E = ENEMIES[k]; tb.innerHTML = statTable(null, [[tr('hp'), E.hp], [tr('speed'), num(E.speed)], [tr('armor'), E.armor], [tr('bounty'), E.bounty]].concat(E.lives ? [[tr('leakCost'), E.lives]] : [])); }
      box.appendChild(tb);
      drawIcon(c, bookTab === 't' ? 0.9 : k === 'boss' ? 1.25 : 1.6, C => bookTab === 't' ? drawTower(C, 0, k, 0, -Math.PI / 2) : drawEnemy(C, k, 0.5, 0.5));
    }
    list.appendChild(box);
  }
  if (bookTab === 'e') { const p = document.createElement('p'); p.className = 'note'; p.textContent = tr('endlessNote'); list.appendChild(p); }
}
function openBook(from) { bookFrom = from; show('book'); }
$('btnInfo').addEventListener('click', () => { drag = null; openBook('play'); });
$('bookBack').addEventListener('click', () => { if (bookFrom === 'play' && G) { show('play'); redraw(); startIdle(); } else show('home'); });
$('tabT').addEventListener('click', () => { bookTab = 't'; buildBook(); });
$('tabE').addEventListener('click', () => { bookTab = 'e'; buildBook(); });

window.addEventListener('resize', () => { if (!scr.play.hidden) { layout(); draw(0); } });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (G && !scr.play.hidden) { buildTools(); renderUI(); if (!running) draw(0); } }); } catch (e) {}

$('appVer').textContent = APP_VERSION;
applyLang();
show('home');

// Offline play: register sw.js only on the GitHub Pages copy (https + *.github.io).
// Not on claude.ai or a local file. If it fails, the game simply needs the internet as before.
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && /(^|\.)github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}
})();
</script>
